<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movimiento Ondulatorio - Física III</title>
    
    <!-- KaTeX CSS is imported via main.js so Vite bundles it -->
    
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <button id="menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="side-menu">☰</button>
    <div id="menu-backdrop" hidden></div>
    <aside id="side-menu" aria-label="Menú principal" inert>
        <div class="menu-heading"><strong>Física III</strong><button id="menu-close" aria-label="Cerrar menú">×</button></div>
        <p class="menu-caption">Movimiento ondulatorio</p>
        <nav class="menu-links" aria-label="Cuadernillo y simuladores">
            <a href="#cuadernillo" data-view="cuadernillo" aria-current="page">Cuadernillo</a>
            <a href="#ondas-estacionarias" data-view="ondas-estacionarias">Ondas estacionarias · UTP</a>
            <a href="#ondas-cuerdas" data-view="ondas-cuerdas">Simulador de ondas en cuerdas</a>
        </nav>
    </aside>
    <div id="app">
        <header id="section-heading"><span>Física III</span><h1 id="view-title">Cuadernillo</h1></header>
        <section id="simulator-container" aria-labelledby="view-title" hidden></section>
        <main id="book-container">
            <!-- Dynamic pages will be inserted here -->
        </main>
        
        <nav id="bottom-nav">
            <button id="btn-home" aria-label="Inicio" title="Ir al inicio">
                <i data-lucide="home"></i>
            </button>
            <button id="btn-prev" aria-label="Página anterior" title="Anterior">
                <i data-lucide="chevron-left"></i> Anterior
            </button>
            
            <div id="page-indicator">
                <span>Página </span><span id="current-page">1</span> de <span id="total-pages">17</span>
            </div>
            
            <button id="btn-next" aria-label="Página siguiente" title="Siguiente">
                Siguiente <i data-lucide="chevron-right"></i>
            </button>
            <button id="btn-index" aria-label="Índice" title="Ir al índice">
                <i data-lucide="list"></i>
            </button>
        </nav>
        
        <footer id="main-footer">
            <p>Cuaderno creado por: <span contenteditable="true" class="editable-name">[nombre del autor o integrantes]</span> | Física III</p>
        </footer>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
